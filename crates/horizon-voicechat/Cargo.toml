[package]
name = "horizon-voicechat"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "LGPL-3.0-or-later"
description = "A Simple Voice Chat client: the plugin's handshake and encrypted UDP protocol, Opus, the microphone and the speakers"

[dependencies]
# AES-128-GCM, the datagrams' cipher.
aes-gcm = "0.10"
getrandom = "0.3"
# libopus is loaded when voice chat starts, so a machine without it still starts the game.
libloading = "0.8"
# The microphone and the speakers, as the game's own audio does.
cpal = { version = "0.16", optional = true }

[lints]
workspace = true

[features]
# The microphone and speakers (the engine). Off, the protocol and the mixing build and test alone.
default = ["audio"]
audio = ["dep:cpal"]
